<button class="tut-maker-button tut-maker-btn" name="netitor-logger">load keylogs.json</button>
<button class="tut-maker-button tut-maker-btn" name="load-data">load data.json</button>
  <div class="tut-maker-kf">
    <div class="tut-maker-kf-header">
      <div>
        <p class="tut-maker-kf-title">Keyframe-title</p>
        <p class="tut-maker-kf-tsp">timestamp: <span>00:26:10</span></p>
      </div>
      <div class="tut-maker-kf-header-right">
        <button class="tut-maker-button" style="padding: 0 15px;" name="edit-kf">edit</button>
        <div class="tut-maker-stepper">
          <button class="tut-maker-arrow">
              <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                <path d="M10 1L1 10L10 19" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
          </button>
          <div class="tut-maker-stepper-count"><p>1</p></div>
          <button class="tut-maker-arrow">
            <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
              <path d="M1 19L10 10L1 1" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="tut-maker-edit-menu">
      <div style="height: 3px; border-radius: 15px; background: var(--netizen-comment);"></div>
      <!-- timestamp steppers -->
      <div class="tut-maker-time-steppers">
        <div class="tut-maker-stepper-cont">
          <p>hours:</p>
          <div class="tut-maker-stepper">
            <button class="tut-maker-arrow">
                <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                  <path d="M10 1L1 10L10 19" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="tut-maker-stepper-count"><p>00</p></div>
            <button class="tut-maker-arrow">
              <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
                <path d="M1 19L10 10L1 1" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="tut-maker-stepper-cont">
          <p>minutes:</p>
          <div class="tut-maker-stepper">
            <button class="tut-maker-arrow">
                <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                  <path d="M10 1L1 10L10 19" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="tut-maker-stepper-count"><p>26</p></div>
            <button class="tut-maker-arrow">
              <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
                <path d="M1 19L10 10L1 1" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="tut-maker-stepper-cont">
          <p>seconds:</p>
          <div class="tut-maker-stepper">
            <button class="tut-maker-arrow">
                <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                  <path d="M10 1L1 10L10 19" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="tut-maker-stepper-count"><p>10</p></div>
            <button class="tut-maker-arrow">
              <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
                <path d="M1 19L10 10L1 1" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- hightlight edit menu -->
      <div id="highlight-dd" class="tut-maker-edit-dd">
        <div class="tut-maker-edit-dd-title">
          <div>
            <div class="tut-maker-hghlght-clr"></div>
            <p class="tut-maker-edit-dd-p">highlight</p>
          </div>
          <svg width="18" height="9" viewBox="0 0 21 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5 1.5L10.5 10.5L19.5 1.5" stroke="#C3C3DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <br>
        <div class="tut-maker-hghlght-edit-menu">
          <!-- edit highlight lines -->
          <div class="tut-maker-hghlght-steppers">
            <p class="tut-maker-edit-dd-p">lines</p>
            <div>
              <div class="tut-maker-vrtl-line"></div>
              <div class="tut-maker-stepper">
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                    <path d="M10 1L1 10L10 19" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div class="tut-maker-stepper-count light start"><p>10</p></div>
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
                    <path d="M1 19L10 10L1 1" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <div class="tut-maker-stepper">
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                    <path d="M10 1L1 10L10 19" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div class="tut-maker-stepper-count light end"><p>10</p></div>
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
                    <path d="M1 19L10 10L1 1" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="tut-maker-l-c-div"></div>
          <!-- edit highlight characters -->
          <div class="tut-maker-hghlght-steppers">
            <p class="tut-maker-edit-dd-p">characters</p>
            <div>
              <div class="tut-maker-vrtl-line"></div>
              <div class="tut-maker-stepper">
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                    <path d="M10 1L1 10L10 19" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div class="tut-maker-stepper-count light start"><p>10</p></div>
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
                    <path d="M1 19L10 10L1 1" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <div class="tut-maker-stepper">
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 1px;">
                    <path d="M10 1L1 10L10 19" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div class="tut-maker-stepper-count light end"><p>10</p></div>
                <button class="tut-maker-arrow-l">
                  <svg width="9" height="18" viewBox="0 0 11 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 1px;">
                    <path d="M1 19L10 10L1 1" stroke="#515199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <!-- edit highlight color -->
          <div class="tut-maker-hghlght-bottom">
            <div class="tut-maker-hghlght-clr-large"></div>
            <div class="tut-maker-vrtl-line"></div>
            <div id="tut-maker-hghlght-clr-input" class="tut-maker-input-l" contenteditable="true">yellow</div>
            <button class="tut-maker-button">clear all</button>
            <button class="tut-maker-button">?</button>
          </div>
        </div>
      </div>
      <!-- spotlight edit menu -->
      <div id="spotlight-dd" class="tut-maker-edit-dd">
        <div class="tut-maker-edit-dd-title">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#C3C3DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20.9 18.55-8-15.98a1 1 0 0 0-1.8 0l-8 15.98"/><ellipse cx="12" cy="19" rx="9" ry="3"/></svg>
            <p class="tut-maker-edit-dd-p">spotlight</p>
          </div>
          <svg width="18" height="9" viewBox="0 0 21 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5 1.5L10.5 10.5L19.5 1.5" stroke="#C3C3DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="tut-maker-sptlght-edit-menu">
          <div></div>
          <div class="tut-maker-sptlght-cont">
            <p class="tut-maker-edit-dd-p">lines</p>
            <div>
              <div class="tut-maker-vrtl-line"></div>
              <div id="tut-maker-sptlght-line-input" class="tut-maker-input-l" contenteditable="true">6-9</div>
              <button class="tut-maker-button">enter</button>
            </div>
          </div>
          <div style="height: 3px; border-radius: 15px; background: var(--netizen-comment);"></div>
          <div id="tut-maker-sptlght-tags">
            <div class="tut-maker-tag">
              <p>12</p>
              <div class="vrtl-line"></div>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 2L2 14" stroke="#23223D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 2L14 14" stroke="#23223D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="tut-maker-sptlght-bottom">
            <div></div>
            <div class="tut-maker-sptlght-bottom-btns">
              <button class="tut-maker-button">clear all</button>
              <button class="tut-maker-button">?</button>
            </div>
          </div>
        </div>
      </div>
      <div class="tut-maker-edit-kl-cont">
        <p>keylog recording:</p>
        <div class="tut-maker-edit-dd">
          <div class="tut-maker-edit-dd-title">
            <p>select a keylog...</p>
            <svg width="18" height="9" viewBox="0 0 21 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1.5 1.5L10.5 10.5L19.5 1.5" stroke="#C3C3DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="tut-maker-delete-cont">
        <div></div>
        <button class="tut-maker-button">delete</button>
      </div>
    </div>
  </div>

<button class="pill-btn pill-btn--secondary tut-maker-btn" name="edit-widgets">add/edit widget</button>
<br>
<div class="tut-maker-row hl" style="margin-top: 10px !important;">
  <input class="input input--lg" type="text" class="ti" placeholder="sl" title="start line number">
  <input class="input input--lg" type="text" class="ti" placeholder="sc" title="start column number">
  <input class="input input--lg" type="text" class="ti" placeholder="el" title="end line number">
  <input class="input input--lg" type="text" class="ti" placeholder="ec" title="end column number">
</div>
<input class="input input--lg" type="text" style="width: 172px;" placeholder="color" title="highlight color">
<div class="tut-maker-row hl">
  <button class="pill-btn pill-btn--secondary tut-maker-btn" name="n-highlight">highlight code</button>
  <button class="pill-btn pill-btn--secondary tut-maker-btn" name="clear-highlight">clear</button>
</div>
<input class="input input--lg" type="text" placeholder="line numbers (comma separated)" style="width: 172px;">
<div class="tut-maker-row">
  <button class="pill-btn pill-btn--secondary tut-maker-btn" name="n-spotlight">spotlight code</button>
  <button class="pill-btn pill-btn--secondary tut-maker-btn" name="clear-spotlight">clear</button>
</div>
<div class="tut-maker-label">keylog recordings</div>
<select class="dropdown dropdown--invert" style="margin-top: 10px !important;" title="keylog recordings"></select>
<hr style="width: 100%">
<button class="pill-btn pill-btn--secondary tut-maker-btn" name="download-data">DOWNLOAD DATA</button>
